<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Valentin Stojanovski – Junior Full-Stack Developer</title>
<meta name="description" content="Portfolio of Valentin Stojanovski, junior full-stack developer from Bitola. Laravel, Angular, React and Kotlin.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #FAF8FF;
  --panel: #EFEBFF;
  --ink: #1A1440;
  --muted: #5E5A80;
  --line: #DDD6F5;
  --blue: #5B3DF5;
  --blue-ink: #FFFFFF;
  --yellow: #FFB238;
  --street: #DCD5F6;
  --river: #CFE2FF;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0F0B24; --panel: #1A1540; --ink: #EEEAFF; --muted: #A8A3D0;
    --line: #2C2660; --blue: #9B86FF; --blue-ink: #0F0B24; --yellow: #FFB238;
    --street: #2A2560; --river: #1B2F5E;
  }
}
:root[data-theme="dark"] {
  --paper: #0F0B24; --panel: #1A1540; --ink: #EEEAFF; --muted: #A8A3D0;
  --line: #2C2660; --blue: #9B86FF; --blue-ink: #0F0B24; --yellow: #FFB238;
  --street: #2A2560; --river: #1B2F5E;
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 64px); }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; border-radius: 4px; }
.wrap { max-width: 1200px; margin: 0 auto; padding: 0 40px; }
@media (min-width: 1500px) { .wrap { max-width: 1320px; } body { font-size: 18px; } }

/* header */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: color-mix(in srgb, var(--paper) 90%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
header.top .wrap { display: flex; align-items: center; justify-content: space-between; height: 56px; gap: 16px; }
.theme-toggle { order: 2; margin-left: auto; margin-right: 4px; width: 38px; height: 38px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font-size: 17px; display: grid; place-items: center; cursor: pointer; flex-shrink: 0; }
.theme-toggle:hover { border-color: var(--blue); }
.brand { white-space: nowrap; font-family: var(--display); font-weight: 800; text-decoration: none; letter-spacing: -0.01em; display: flex; align-items: center; gap: 10px; }
.brand i { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 6px; background: var(--blue); color: var(--blue-ink); font-style: normal; font-size: 15px; font-weight: 800; }
nav { display: flex; gap: 20px; overflow-x: auto; }
nav a { text-decoration: none; font-size: 15px; color: var(--muted); white-space: nowrap; padding: 4px 0; }
nav a:hover { color: var(--ink); }

/* hero */
.hero { padding: 56px 0 72px; background: radial-gradient(90% 70% at 85% 0%, color-mix(in srgb, var(--blue) 18%, transparent), transparent 70%), radial-gradient(60% 50% at 0% 100%, color-mix(in srgb, var(--yellow) 16%, transparent), transparent 70%); }
.hero .wrap { display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 48px; align-items: center; }
h1 { font-family: var(--display); font-weight: 800; font-size: clamp(2.8rem, 7.5vw, 5.6rem); line-height: 0.95; letter-spacing: -0.035em; margin: 0 0 24px; }
.lead { font-size: clamp(1.15rem, 2.2vw, 1.4rem); line-height: 1.45; max-width: 34ch; margin: 0 0 16px; }
.sub { color: var(--muted); max-width: 46ch; margin: 0 0 28px; }
.sub strong { color: var(--ink); font-weight: 600; }
.actions { display: flex; flex-wrap: wrap; gap: 12px; }
.btn { display: inline-block; padding: 12px 22px; border-radius: 999px; font-weight: 600; text-decoration: none; font-size: 16px; border: 2px solid var(--blue); color: var(--blue); }
.btn.primary { background: var(--blue); border-color: var(--blue); color: var(--blue-ink); box-shadow: 0 8px 20px color-mix(in srgb, var(--blue) 35%, transparent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost:hover { background: color-mix(in srgb, var(--blue) 12%, transparent); }
.map { width: 100%; height: auto; border-radius: 28px; background: var(--panel); border: 1px solid var(--line); box-shadow: 0 24px 60px color-mix(in srgb, var(--blue) 22%, transparent); }
.map .st { stroke: var(--street); stroke-width: 10; fill: none; stroke-linecap: round; }
.map .st.thin { stroke-width: 5; }
.map .river { fill: var(--river); }
.map .route { stroke: var(--yellow); stroke-width: 9; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.map .route-edge { stroke: var(--ink); stroke-width: 15; fill: none; stroke-linecap: round; stroke-linejoin: round; opacity: .9; }
.map .x { stroke: #E5386D; stroke-width: 5; stroke-linecap: round; }
.map .pin rect { fill: var(--blue); }
.map .pin text { fill: var(--blue-ink); font: 800 30px var(--display); }
.map .start { fill: var(--ink); }
@media (prefers-reduced-motion: no-preference) {
  .map .route, .map .route-edge { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 2.6s .3s cubic-bezier(.6,.05,.3,1) forwards; }
  .map .pin { opacity: 0; transform-origin: 400px 96px; animation: drop .5s 2.7s ease-out forwards; }
  .map .x { opacity: 0; animation: fade .3s 1.2s forwards; }
}
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes drop { from { opacity: 0; transform: translateY(-14px); } to { opacity: 1; transform: none; } }
@keyframes fade { to { opacity: 1; } }

/* sections */
section { padding: 64px 0; border-top: 1px solid var(--line); }
.row { display: grid; grid-template-columns: 200px 1fr; gap: 40px; }
h2 { font-family: var(--display); color: var(--blue); font-size: 1.6rem; letter-spacing: -0.02em; margin: 0; line-height: 1.1; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 80px); align-self: start; }
h3 { font-family: var(--display); font-size: 1.5rem; letter-spacing: -0.02em; margin: 0 0 4px; line-height: 1.15; }
.meta { color: var(--muted); font-size: 15px; margin: 0 0 12px; }
p { margin: 0 0 12px; max-width: 64ch; }
.item { background: var(--panel); border-radius: 20px; padding: 28px; margin-bottom: 20px; }
.item:last-child { margin-bottom: 0; }
.tags { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 0; padding: 0; list-style: none; }
.tags li { background: var(--paper); color: var(--blue); border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; font-size: 14px; font-weight: 500; }
ul.plain { padding-left: 20px; margin: 0 0 12px; max-width: 64ch; }
ul.plain li { margin-bottom: 6px; }
.link { font-weight: 600; text-decoration-thickness: 2px; text-underline-offset: 4px; text-decoration-color: var(--blue); }
.link:hover { text-decoration-color: var(--yellow); }
.badge { display: inline-block; background: var(--yellow); color: #1A1440; font-weight: 600; font-size: 14px; padding: 3px 12px; border-radius: 999px; margin-bottom: 10px; }
ol.events { list-style: none; margin: 0; padding: 0; }
ol.events li { display: grid; grid-template-columns: 170px 1fr; gap: 8px 28px; padding: 22px 0; border-bottom: 1px solid var(--line); }
ol.events li:first-child { padding-top: 0; }
ol.events li:last-child { border-bottom: 0; padding-bottom: 0; }
ol.events .when { color: var(--blue); font-weight: 600; font-size: 15px; }
ol.events h3 { font-size: 1.2rem; margin: 0 0 2px; }
ol.events p { margin: 0 0 6px; }
ol.events .where { color: var(--muted); font-size: 15px; margin-bottom: 8px; }
dl.skills { margin: 0; display: grid; grid-template-columns: 140px 1fr; gap: 14px 20px; }
dl.skills dt { font-weight: 600; }
dl.skills dd { margin: 0; color: var(--muted); }
.contact-big { font-family: var(--display); font-weight: 800; font-size: clamp(1.1rem, 3vw, 1.7rem); letter-spacing: -0.02em; word-break: break-word; text-decoration-thickness: 3px; text-underline-offset: 6px; text-decoration-color: var(--yellow); }
footer { padding: 32px 0 48px; color: var(--muted); font-size: 14px; border-top: 1px solid var(--line); }

@media (max-width: 820px) {
  ol.events li { grid-template-columns: 1fr; gap: 2px; }
  .wrap { padding: 0 20px; }
  .item { padding: 22px; }
  header.top .wrap { height: auto; flex-wrap: wrap; row-gap: 0; padding-top: 10px; padding-bottom: 4px; }
  nav { order: 3; }
  nav { width: 100%; justify-content: flex-start; flex-wrap: wrap; gap: 0 18px; overflow-x: visible; }
  nav a { font-size: 14px; padding: 8px 0; }
  html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 96px); }
  .hero .wrap { grid-template-columns: 1fr; gap: 36px; }
  .row { grid-template-columns: 1fr; gap: 20px; }
  h2 { position: static; }
  dl.skills { grid-template-columns: 1fr; gap: 2px; }
  dl.skills dd { margin-bottom: 12px; }
  section { padding: 48px 0; }
  .map { max-width: 420px; }
}
@media (max-width: 480px) {
  body { font-size: 16px; }
  .wrap { padding: 0 16px; }
  .item { padding: 18px; border-radius: 16px; }
  .hero { padding: 32px 0 48px; }
  .actions .btn { flex: 1 1 100%; text-align: center; }
  .map { max-width: 100%; border-radius: 20px; }
}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="brand" href="#top">Valentin Stojanovski</a>
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch between light and dark theme"><span id="themeIcon">🌙</span></button>
    <nav aria-label="Sections">
      <a href="#projects">Projects</a>
      <a
